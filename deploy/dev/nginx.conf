# LitaWork 开发验收环境 nginx 站点配置
# 安装位置：/etc/nginx/sites-available/work-test.agent.cinta.team
# 启用：ln -s /etc/nginx/sites-available/work-test.agent.cinta.team /etc/nginx/sites-enabled/work-test.agent.cinta.team

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name work-test.agent.cinta.team;

    # 前端构建产物；由 deploy/dev/deploy.sh 构建后保持最新
    root /home/ecs-user/work/litawork/frontend/dist;
    index index.html;

    # 上传文件最大 50MB，留出 multipart 余量
    client_max_body_size 60m;

    location /api/ {
        proxy_pass http://127.0.0.1:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # SSE / 长任务输出
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # 后端静态资源：图片 / 导出产物 / 通用文件
    location /images/ {
        proxy_pass http://127.0.0.1:3100/images/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /export-files/ {
        proxy_pass http://127.0.0.1:3100/export-files/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /files/ {
        proxy_pass http://127.0.0.1:3100/files/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
